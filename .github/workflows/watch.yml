name: Watch for cancellations

on:
  schedule:
    - cron: "*/10 * * * *"   # about every 10 minutes (GitHub sometimes runs late)
  workflow_dispatch:
    inputs:
      test_push:
        description: "Send a test alert to every phone with alerts turned on"
        type: boolean
        default: false

concurrency:
  group: siteline-watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python watch.py
        env:
          FIREBASE_SERVICE_ACCOUNT_B64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_B64 }}
          SITELINE_URL: ${{ vars.SITELINE_URL }}
          TEST_PUSH: ${{ inputs.test_push }}
